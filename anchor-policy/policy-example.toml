# 由 anchor-policy sign 读取的离线策略示例，随策略工具包一起发给管理员。
#
# 策略表达的是设备端的行为规则，不是设备清单：写 deny 的域不需要任何设备标识，
# 设备端自己枚举本机设备并全部禁用。只有需要为个别设备开例外时，才要填写对应的
# 设备实例标识，标识来自设备观测记录。
version = 1
expires_at = "2026-12-31T15:59:59Z"

# 禁用全部 USB 大容量存储，但保留下面这支管理 U 盘作为策略更新通道；
# 键盘、鼠标等非存储外设不受任何 USB 规则影响。
[usb]
read = "deny"
write = "deny"

# 管理介质：策略必须放行至少一支用于后续导入策略的 U 盘（或用 burning.allowed 放行刻录光驱）。
# 把下面的实例标识换成你自己的管理 U 盘；设备观测记录里能查到该标识。
# 一旦策略生效，只有这里放行的介质还能被设备读取，所以别把这一项漏掉。
[[usb.allowed]]
instance_id = "USBSTOR\\Disk&Ven_Example&Prod_Storage\\0019E06B"

# 禁用全部网卡。
[network]
policy = "deny"

# 禁用全部刻录光驱。
[burning]
policy = "deny"

# 确实要让设备彻底失去更新通道（此后只能离线改盘或重装）时，签发时加 --no-admin-media。

# 不监视任何目录即不启用文件扫描；需要时再填写目录和规则。
[scan]
controlled_dirs = []
# file_types 为空表示扫描全部支持的类型（txt、csv、docx、xlsx、pptx）。
# file_types = ["txt", "docx"]

# 需要放行个别设备时，把对应域的 deny 改成 allow 并列出例外，例如：
#
# [network]
# policy = "allow"
#
# [[network.allowed]]
# adapter_id = "PCI\\VEN_8086&DEV_15BE&SUBSYS_00000000&REV_00\\3&11583659&0&C8"
#
# [usb]
# read = "allow"
# write = "allow"
#
# [[usb.allowed]]
# instance_id = "USBSTOR\\Disk&Ven_Example&Prod_Storage\\0019E06B"
